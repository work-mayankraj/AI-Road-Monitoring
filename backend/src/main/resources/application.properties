spring.application.name=roadguard-backend
server.port=8080

# ---- PostgreSQL (override with environment variables) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roadguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# "update" creates/updates tables automatically (fine for development).
# database/schema.sql is the same schema if you prefer to create it by hand (then use "validate").
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# ---- JWT ----
# Base64 secret, at least 256 bits. CHANGE THIS (set JWT_SECRET) for anything other than local development.
roadguard.jwt.secret=${JWT_SECRET:iwO5AOsSuzxxFzkXJYwKMDDyvNOkxYFEiDXuM9R7OeQ=}
roadguard.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# ---- Files (frame images from uploads) ----
roadguard.upload-dir=${UPLOAD_DIR:./uploads}

# ---- CORS: the origins the frontend is served from ----
roadguard.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000}

# ---- Accounts created on first start ----
roadguard.admin.name=${ADMIN_NAME:Admin User}
roadguard.admin.email=${ADMIN_EMAIL:admin@demo.com}
roadguard.admin.password=${ADMIN_PASSWORD:admin123}
roadguard.seed-demo-user=${SEED_DEMO_USER:true}
