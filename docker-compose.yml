# Optional: PostgreSQL for local development ->  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: roadguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - roadguard-db:/var/lib/postgresql/data
volumes:
  roadguard-db:
