<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - RoadGuard AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
            accent: { 500: '#f59e0b', 600: '#d97706' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
  <nav class="bg-white shadow-sm border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-9 h-9 bg-primary-600 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
          </div>
          <span class="font-bold text-xl text-primary-800">RoadGuard <span class="text-accent-500">AI</span></span>
        </a>
        <a href="login.html" class="text-primary-600 hover:text-primary-700 font-medium">Sign in</a>
      </div>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-slate-900">Create your account</h1>
          <p class="text-slate-600 mt-1">Join RoadGuard AI and start reporting potholes</p>
          <p class="text-xs text-slate-400 mt-2">Public sign-up creates a User account. Administrator accounts are issued by the system owner.</p>
        </div>

        <form id="registerForm" class="space-y-5" onsubmit="handleRegister(event)">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Full name</label>
            <input type="text" id="name" required placeholder="John Doe"
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
            <input type="email" id="email" required placeholder="you@example.com"
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
            <input type="password" id="password" required minlength="6" placeholder="At least 6 characters"
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1.5">Confirm password</label>
            <input type="password" id="confirm" required placeholder="••••••••"
              class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition" />
          </div>
          <label class="flex items-start gap-2 cursor-pointer">
            <input type="checkbox" required class="mt-1 w-4 h-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500" />
            <span class="text-sm text-slate-600">I agree to the Terms of Service and Privacy Policy. This is a college prototype.</span>
          </label>
          <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2.5 rounded-lg transition">
            Create Account
          </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-200">
          <p class="text-center text-sm text-slate-600">
            Already have an account?
            <a href="login.html" class="text-primary-600 hover:text-primary-700 font-medium">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (pass !== confirm) {
        alert('Passwords do not match');
        return;
      }
      const btn = e.target.querySelector('button[type=submit]');
      if (btn) btn.disabled = true;
      const res = await RG.register(name, email, pass);
      if (btn) btn.disabled = false;
      if (!res.ok) { alert(res.error); return; }
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
