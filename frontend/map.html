<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pothole Map - RoadGuard AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
            accent: { 500: '#f59e0b', 600: '#d97706' },
            success: { 500: '#10b981', 600: '#059669' }
          }
        }
      }
    }
  </script>
  <style>
    #map { height: calc(100vh - 64px); width: 100%; z-index: 0; }
    .leaflet-popup-content-wrapper { border-radius: 12px; }
    .legend { background: white; padding: 10px 14px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 13px; }
    .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  </style>
  <script src="app.js"></script>
  <script>RG.requireRole('user');</script>
</head>
<body class="bg-slate-50 text-slate-800 overflow-hidden">
  <nav class="bg-white shadow-sm sticky top-0 z-50 border-b border-slate-200">
    <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <a href="index.html" class="flex items-center gap-2">
          <div class="w-9 h-9 bg-primary-600 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
          </div>
          <span class="font-bold text-xl text-primary-800">RoadGuard <span class="text-accent-500">AI</span></span>
        </a>
        <div class="hidden md:flex items-center gap-6">
          <a href="dashboard.html" class="text-slate-600 hover:text-primary-600">Dashboard</a>
          <a href="upload.html" class="text-slate-600 hover:text-primary-600">Upload</a>
          <a href="map.html" class="text-primary-700 font-medium">Map</a>
          <a href="complaint.html" class="text-slate-600 hover:text-primary-600">Complaints</a>
        </div>
        <div class="flex items-center gap-3">
          <select id="filterStatus" onchange="filterMarkers()" class="text-sm border border-slate-300 rounded-lg px-3 py-1.5 outline-none focus:ring-2 focus:ring-primary-500">
            <option value="all">All statuses</option>
            <option value="review">Awaiting review</option>
            <option value="confirmed">Confirmed</option>
            <option value="pending">Complaint pending</option>
            <option value="in_progress">In Progress</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
      </div>
    </div>
  </nav>

  <div id="map"></div>
  <div id="mapEmpty" class="hidden absolute left-1/2 top-28 -translate-x-1/2 z-[1000] bg-white rounded-xl shadow-lg border border-slate-200 px-5 py-4 text-sm text-slate-600 text-center max-w-sm">
    <b class="text-slate-800">No located potholes yet.</b><br>Upload a video with a GPS file, or a JPEG photo with its location, and they will appear here.
    <div class="mt-3"><a href="upload.html" class="text-primary-600 font-medium">Upload now →</a></div>
  </div>

  <script>
    const map = L.map('map').setView([12.9716, 77.5946], 13);
    RG.addBaseMaps(map);   // Esri Streets by default; Esri Satellite and CARTO Light in the layer switcher

    const COLORS = { review: '#94a3b8', confirmed: '#3b82f6', pending: '#f59e0b', in_progress: '#8b5cf6', resolved: '#10b981' };
    const LABELS = { review: 'Awaiting review', confirmed: 'Confirmed', pending: 'Complaint pending', in_progress: 'In progress', resolved: 'Resolved' };
    const markers = [];

    const icon = color => L.divIcon({
      className: '', iconSize: [18, 18], iconAnchor: [9, 9],
      html: `<div style="background:${color};width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>`
    });

    function mapStatus(d) {
      const c = RG.complaintForDetection(d.id);
      return c ? c.status : (d.status === 'confirmed' ? 'confirmed' : 'review');
    }

    RG.ready.then(() => {
      RG.myDetections().filter(d => d.lat != null && d.lng != null && d.status !== 'rejected').forEach(d => {
        const st = mapStatus(d), c = RG.complaintForDetection(d.id), sess = RG.session(d.sessionId);
        const m = L.marker([d.lat, d.lng], { icon: icon(COLORS[st]) }).addTo(map).bindPopup(`
          <div style="min-width:210px">
            <div style="font-weight:600;margin-bottom:6px">Pothole #${d.n} — ${RG.esc(sess ? sess.name : '')}</div>
            <div style="position:relative;height:110px;border-radius:8px;overflow:hidden;background:#e2e8f0;margin-bottom:8px">${RG.frameHtml(d)}</div>
            <div style="font-size:12px;color:#64748b;margin-bottom:4px">Status: <strong>${LABELS[st]}</strong></div>
            <div style="font-size:12px;color:#64748b;margin-bottom:8px">Confidence: <strong>${d.conf}%</strong> • ${RG.coord(d.lat, d.lng)}</div>
            <div style="display:flex;gap:6px">
              <a href="pothole-details.html?id=${d.id}" style="flex:1;text-align:center;padding:6px;background:#2563eb;color:white;border-radius:6px;font-size:12px;text-decoration:none">Details</a>
              <a href="${c ? 'complaint.html' : 'processing.html?session=' + d.sessionId}" style="flex:1;text-align:center;padding:6px;background:#f1f5f9;color:#334155;border-radius:6px;font-size:12px;text-decoration:none">${c ? 'Complaint ' + c.id : 'Review'}</a>
            </div>
          </div>`);
        m._status = st; markers.push(m);
      });

      if (markers.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(0.3), { maxZoom: 17 });
      else document.getElementById('mapEmpty').classList.remove('hidden');
    });

    // Legend
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = '<div style="font-weight:600;margin-bottom:6px">Status</div>' +
        Object.keys(LABELS).map(k => `<div><i style="background:${COLORS[k]}"></i> ${LABELS[k]}</div>`).join('');
      return div;
    };
    legend.addTo(map);

    function filterMarkers() {
      const val = document.getElementById('filterStatus').value;
      markers.forEach(m => { if (val === 'all' || m._status === val) m.addTo(map); else map.removeLayer(m); });
    }
  </script>
</body>
</html>
